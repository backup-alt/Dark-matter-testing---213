name: Dark Matter Cloud Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task instructions from Dark Matter mobile'
        required: true
        type: string
      model:
        description: 'OpenCode model ID (e.g. opencode/big-pickle)'
        required: false
        default: 'opencode/big-pickle'
        type: string
      agent:
        description: 'Agent profile (build or plan)'
        required: false
        default: 'build'
        type: string
      thread_id:
        description: 'Dark Matter thread ID'
        required: false
        default: ''
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  opencode-mobile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Cache OpenCode CLI
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode-cli
          key: ${{ runner.os }}-opencode-cli-v1

      - name: Prepare OpenCode CLI
        run: |
          mkdir -p "$HOME/.opencode-cli"
          if [ ! -x "$HOME/.opencode-cli/node_modules/.bin/opencode" ]; then
            npm install --prefix "$HOME/.opencode-cli" --no-save --silent opencode-ai@latest
          fi
          echo "$HOME/.opencode-cli/node_modules/.bin" >> "$GITHUB_PATH"
          git config user.name "Dark Matter Agent"
          git config user.email "dark-matter-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode CLI
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
          OPENCODE_CONFIG: "/tmp/dark-matter-opencode.json"
          TASK_PROMPT: ${{ inputs.prompt }}
          TASK_MODEL: ${{ inputs.model || 'opencode/big-pickle' }}
          TASK_AGENT: ${{ inputs.agent || 'build' }}
          TASK_THREAD_ID: ${{ inputs.thread_id }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          MODEL="${TASK_MODEL:-opencode/big-pickle}"
          AGENT_MODE="${TASK_AGENT:-build}"
          OUT_FILE="/tmp/opencode_reply.txt"
          ERR_FILE="/tmp/opencode_err.txt"

          if [ "$AGENT_MODE" = "plan" ]; then
            printf '{"permission":{"*":"deny","read":"allow","glob":"allow","grep":"allow","list":"allow"}}' > /tmp/dark-matter-opencode.json
            export OPENCODE_PERMISSION='{"*":"deny","read":"allow","glob":"allow","grep":"allow","list":"allow"}'
            INSTRUCTIONS=$(printf '[PLAN / READ-ONLY MODE - Inspect files only. Do not modify or create files.]\n\n%s' "$TASK_PROMPT")
          else
            printf '{"permission":"allow"}' > /tmp/dark-matter-opencode.json
            export OPENCODE_PERMISSION='{"*":"allow"}'
            INSTRUCTIONS="$TASK_PROMPT"
          fi

          run_opencode() {
            if opencode run --help 2>&1 | grep -q -- '--agent'; then
              opencode run -m "$MODEL" --agent "$AGENT_MODE" "$INSTRUCTIONS"
            else
              opencode run -m "$MODEL" "$INSTRUCTIONS"
            fi
          }

          set +e
          run_opencode >"$OUT_FILE" 2>"$ERR_FILE"
          STATUS=$?
          set -e

          if [ $STATUS -ne 0 ] || [ ! -s "$OUT_FILE" ]; then
            if grep -qiE "Free usage limit|rate limit|401|unauthorized|quota" "$ERR_FILE" "$OUT_FILE" 2>/dev/null || [ -z "$OPENCODE_API_KEY" ]; then
              echo "Retrying OpenCode CLI with public free tier..."
              set +e
              env -u OPENCODE_API_KEY bash -c '
                if opencode run --help 2>&1 | grep -q -- "--agent"; then
                  opencode run -m "$1" --agent "$2" "$3"
                else
                  opencode run -m "$1" "$3"
                fi
              ' _ "$MODEL" "$AGENT_MODE" "$INSTRUCTIONS" >"$OUT_FILE" 2>"$ERR_FILE"
              STATUS=$?
              set -e
            fi
          fi

          PR_URL=""
          PR_ERROR=""
          BRANCH_NAME=""
          CHANGED_FILES=""
          if [ "$AGENT_MODE" != "plan" ] && [ -n "$(git status --porcelain)" ]; then
            BRANCH_NAME="dark-matter/cloud-${GITHUB_RUN_ID}"
            git checkout -b "$BRANCH_NAME"
            git add -A
            CHANGED_FILES=$(git diff --cached --name-only | tr '\n' ',' | sed 's/,$//')
            git commit -m "feat(dark-matter): ${TASK_THREAD_ID:-cloud-task}"
            if git push -u origin "$BRANCH_NAME" 2>/tmp/git_push_err.txt; then
              PR_OUT=$(gh pr create --base "${BASE_BRANCH:-main}" --head "$BRANCH_NAME" --title "Dark Matter: ${TASK_THREAD_ID:-Cloud Agent Update}" --body "Automated OpenCode cloud run #${GITHUB_RUN_ID} using model \`$MODEL\`. Changed files: ${CHANGED_FILES}" 2>&1 || true)
              PR_URL=$(printf '%s\n' "$PR_OUT" | grep -E '^https://' | tail -n 1 || true)
              if [ -z "$PR_URL" ]; then
                PR_ERROR=$(printf '%s' "$PR_OUT" | tr '\n' ' ' | head -c 220)
              fi
            else
              PR_ERROR=$(cat /tmp/git_push_err.txt | tr '\n' ' ' | head -c 220)
              BRANCH_NAME=""
            fi
          fi

          printf '\n%s\n' '<<<DARK_MATTER_REPLY_START>>>'
          if [ -s "$OUT_FILE" ]; then
            cat "$OUT_FILE"
          elif [ -s "$ERR_FILE" ]; then
            echo "OpenCode CLI failed (exit $STATUS):"
            cat "$ERR_FILE"
          else
            echo "OpenCode CLI finished (exit $STATUS) with empty output."
          fi
          printf '\n%s\n' '<<<DARK_MATTER_REPLY_END>>>'
          if [ -n "$BRANCH_NAME" ]; then
            printf '<<<DARK_MATTER_BRANCH>>>%s<<<DARK_MATTER_BRANCH_END>>>\n' "$BRANCH_NAME"
          fi
          if [ -n "$CHANGED_FILES" ]; then
            printf '<<<DARK_MATTER_FILES>>>%s<<<DARK_MATTER_FILES_END>>>\n' "$CHANGED_FILES"
          fi
          if [ -n "$PR_URL" ]; then
            printf '<<<DARK_MATTER_PR_URL>>>%s<<<DARK_MATTER_PR_URL_END>>>\n' "$PR_URL"
          fi
          if [ -n "$PR_ERROR" ]; then
            printf '<<<DARK_MATTER_PR_ERROR>>>%s<<<DARK_MATTER_PR_ERROR_END>>>\n' "$PR_ERROR"
          fi

          if [ $STATUS -ne 0 ] && [ ! -s "$OUT_FILE" ]; then
            exit $STATUS
          fi

  opencode-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Run OpenCode PR Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
